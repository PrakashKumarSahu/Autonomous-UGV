# Semantic Hazard Mapping: Maps detected instance class names or IDs to terrain traversability costs
# Values:
#   0   - Traversable (dirt trail, packed grass, clear ground)
#   128 - Caution / Unknown (high grass, brush, distant unclassified)
#   255 - Lethal Hazard (rocks, boulders, trees, ditches, debris, water, obstacles)

hazard_mapping:
  # Common COCO and off-road dataset hazard classes
  lethal_classes:
    - "rock"
    - "boulder"
    - "tree"
    - "trunk"
    - "log"
    - "ditch"
    - "pothole"
    - "water"
    - "mud"
    - "fence"
    - "car"
    - "truck"
    - "person"
    - "obstacle"

  caution_classes:
    - "bush"
    - "shrub"
    - "tall_grass"
    - "vegetation"

  traversable_classes:
    - "path"
    - "trail"
    - "dirt"
    - "ground"
    - "short_grass"
    - "road"
