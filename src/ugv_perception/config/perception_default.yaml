depth_node:
  ros__parameters:
    input_image_topic: "/camera/image_raw"
    camera_info_topic: "/camera/camera_info"
    output_depth_topic: "/perception/depth/image_raw"
    output_points_topic: "/perception/depth/points"
    depth_frame_id: "camera_link_optical"
    model_type: "depth_anything_v2"
    device: "cuda:0"
    enable_fp16: true
    min_depth: 0.2
    max_depth: 25.0
    publish_pointcloud: true

yolo_seg_node:
  ros__parameters:
    input_image_topic: "/camera/image_raw"
    output_mask_topic: "/perception/hazard_mask"
    output_overlay_topic: "/perception/yolo/overlay"
    model_name: "yolov8n-seg.pt"  # or yolo11n-seg.pt
    confidence_threshold: 0.35
    device: "cuda:0"
    enable_fp16: true
