terrain_analysis_node:
  ros__parameters:
    pointcloud_topic: "/perception/depth/points"
    hazard_mask_topic: "/perception/hazard_mask"
    output_grid_topic: "/terrain/traversability_grid"
    map_frame: "odom"
    base_frame: "base_footprint"
    grid_resolution: 0.10     # meters per cell
    grid_size_x: 12.0         # 12m width
    grid_size_y: 12.0         # 12m length
    max_step_height: 0.22     # max obstacle vertical step (meters)
    max_slope_angle: 25.0     # max traversable slope (degrees)
    slope_weight: 1.0
    roughness_weight: 1.2
    hazard_weight: 2.0
