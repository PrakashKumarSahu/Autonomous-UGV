# nav2_params.yaml — Autonomous UGV Navigation Configuration
#
# KEY DESIGN DECISIONS:
# ─────────────────────────────────────────────────────────────────────────────
# 1. movement_time_allowance: 8.0s (was 25.0)
#    → Detect stuck state in 8 seconds. Robot moving at 0.5m/s must cover at
#      least 0.30m in 8s. If blocked by a wall, this triggers recovery quickly.
#    → After recovery fails (spin + backup + wait), Nav2 cancels the goal and
#      reports FAILED. The robot stops and holds position.
#
# 2. failure_tolerance: 0.5 (was 1.0)
#    → Controller/TF errors are tolerated for 0.5s before the controller server
#      reports failure to the BT navigator. Lower = fail faster on real errors.
#
# 3. use_collision_detection: true (was false)
#    → RPP checks if the current path segment will intersect with costmap
#      obstacles. If it would, it stops and triggers replanning rather than
#      driving into the wall. This is the primary defense against driving into
#      walls that weren't mapped by SLAM.
#    → Was disabled previously because noisy depth clouds caused phantom stops.
#      Now safe because: inflation_radius=0.75m keeps the robot far from walls,
#      observation_persistence=0.5s clears transient noise quickly.
#
# 4. inflation_radius: 0.75m (was 0.55m local / 0.60m global)
#    → Robot (radius 0.30m) gets a 0.45m safety margin around every obstacle.
#    → Total clearance from any wall surface: 0.30 + 0.45 = 0.75m.
#    → Prevents the robot from getting physically close enough to walls that
#      the front-facing camera can't detect them.
#
# 5. desired_linear_vel: 0.4m/s (was 0.5m/s)
#    → Slower speed = more time to react when an undetected obstacle appears.
#    → Reduces distance traveled before RPP collision detection triggers.
# ─────────────────────────────────────────────────────────────────────────────

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /odometry/filtered
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # 0.5s tolerance: fail faster when TF/costmap errors occur, triggering
    # recovery behaviors sooner. Was 1.0 (too long, robot kept trying to drive
    # into walls during the 1s window of tolerated failures).
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    current_progress_checker: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    current_goal_checker: "general_goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Robot must move 0.30m in 8s or Nav2 declares it stuck and tries recovery.
      # At 0.4m/s desired speed: 0.30m should take <1s under normal conditions.
      # This quickly catches the case where the robot is physically blocked (wheel
      # spin but no translation due to wall contact causing odometry drift).
      required_movement_radius: 0.30
      movement_time_allowance: 8.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.30
      stateful: false
      xy_goal_tolerance_buffer: 0.10

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Reduced from 0.5 → 0.4: more time to react to detected obstacles
      desired_linear_vel: 0.4
      lookahead_dist: 0.8
      min_lookahead_dist: 0.40
      max_lookahead_dist: 1.4
      lookahead_time: 1.2
      stateful: false
      rotate_to_heading_angular_vel: 0.8
      # Must match RTAB-Map 1Hz TF publish rate to prevent TF lookup failures
      transform_tolerance: 1.0
      max_robot_pose_search_dist: 5.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.8
      use_interpolation: true
      # ENABLED: RPP now checks if the current path will collide with costmap
      # obstacles. Stops and triggers replanning when a wall is detected ahead.
      # This is the primary safeguard when SLAM has not mapped an obstacle yet
      # (e.g. a wall the camera has not seen from the current approach angle).
      # Safe to enable because: inflation_radius=0.75m keeps robot far from walls,
      # so real obstacle cells are in the costmap well before proximity collision.
      use_collision_detection: true
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.85
      max_angular_accel: 1.8

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_penalty: 2.0
      downsample_costmap: false
      downsampling_factor: 1

behaviors:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_timeout: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      transform_tolerance: 1.0
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.08
      robot_radius: 0.32
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: depth_camera
        depth_camera:
          topic: /perception/depth/points
          data_type: PointCloud2
          marking: true
          clearing: true
          max_obstacle_height: 2.5
          min_obstacle_height: 0.05
          obstacle_range: 6.0
          raytrace_range: 7.0
          sensor_frame: ""
          inf_is_valid: false
          # 0.5s: clears stale obstacles quickly as the robot turns and the
          # front-facing camera's field of view sweeps across previously blocked areas.
          observation_persistence: 0.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Increased from 0.55 → 0.75m: robot (r=0.32m) gets 0.43m safety margin.
        # Total wall clearance in planned paths: 0.32 + 0.43 = 0.75m from wall surface.
        # This ensures the planner routes the robot far enough from walls that the
        # front-facing camera sees any obstacle before the robot reaches it.
        cost_scaling_factor: 2.5
        inflation_radius: 0.75

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      transform_tolerance: 1.0
      robot_radius: 0.32
      resolution: 0.10
      track_unknown_space: true
      rolling_window: false
      width: 50
      height: 50
      origin_x: -25.0
      origin_y: -25.0
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: "/map"
        subscribe_to_updates: true
        footprint_clearing_enabled: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Increased from 0.60 → 0.75m: consistent with local costmap.
        # Global planner routes 0.75m away from any mapped wall surface.
        cost_scaling_factor: 2.5
        inflation_radius: 0.75
