# rtabmap.yaml — RTAB-Map Visual SLAM configuration
# Applied to the 'rtabmap' node in localization.launch.py.
# Parameters set here can be overridden by explicit parameters in the launch file.
#
# NOTE: The 'rgbd_odometry' section has been removed — that node is not launched.
# RTAB-Map uses wheel odometry from /odometry/filtered (Gazebo DiffDrive) via TF.

rtabmap:
  ros__parameters:
    frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    publish_tf: true
    subscribe_rgbd: true
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_scan: false
    approx_sync: true
    queue_size: 20
    wait_for_transform: 1.0   # was 0.5 — prevents frame drops during Gazebo startup
    tf_tolerance: 0.5         # was 0.3 — more tolerant of TF latency spikes

    # Force 2D SLAM for planar ground UGV
    Reg/Force3DoF: "true"
    Optimizer/Slam2D: "true"

    # Memory / Database
    Mem/IncrementalMemory: "true"
    Mem/InitWMWithAllNodes: "false"
    Mem/RehearsalSimilarity: "0.60"
    Mem/DepthCompressionFormat: ".png"

    # Keyframe creation thresholds — set to 0 so first frame immediately creates a node.
    # Without this, RTAB-Map waits for the robot to move RGBD/LinearUpdate (0.1m) before
    # creating any keyframe → /map never published until robot moves → RViz "No map received".
    # With 0.0, every processed frame can create a new node (rate-limited by Rtabmap/DetectionRate).
    RGBD/LinearUpdate: "0.0"
    RGBD/AngularUpdate: "0.0"

    # Create intermediate nodes (not just loop-closure nodes) for more frequent map updates
    Rtabmap/CreateIntermediateNodes: "true"

    RGBD/ProximityBySpace: "false"
    RGBD/OptimizeFromGraphEnd: "false"
    RGBD/NeighborLinkRefining: "false"

    # Visual Feature Extraction for SLAM
    Vis/FeatureType: "8"
    Vis/MaxFeatures: "1000"
    Vis/MinInliers: "15"

    # 2D Grid Map generation for Nav2 — calibrated for real depth sensor (0.1-10 m)
    Grid/FromDepth: "true"
    Grid/RangeMax: "10.0"     # was 15.0 — matches Gazebo depth sensor far clip
    Grid/RayTracing: "true"
    Grid/CellSize: "0.10"
    Grid/NormalsSegmentation: "false"
    Grid/MaxGroundHeight: "0.15"   # was 0.12 — slightly higher for stability
    Grid/MaxObstacleHeight: "2.0"
    Grid/GroundIsObstacle: "false"
    Grid/NoiseFilteringRadius: "0.15"
    Grid/NoiseFilteringMinNeighbors: "5"
    GridGlobal/FootprintRadius: "0.55"
    GridGlobal/Eroded: "true"


