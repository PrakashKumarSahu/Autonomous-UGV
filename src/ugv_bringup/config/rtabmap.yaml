rgbd_odometry:
  ros__parameters:
    frame_id: "base_footprint"
    odom_frame_id: "rtabmap_odom"
    publish_tf: false
    subscribe_rgbd: true
    subscribe_rgb: false
    subscribe_depth: false
    approx_sync: true
    queue_size: 20

    # Visual Odometry Parameters (FAST / ORB / GFTT)
    Reg/Force3DoF: "true"
    Odom/Holonomic: "false"
    Vis/FeatureType: "8"  # 8=FAST/ORB (High FPS)
    Vis/MaxFeatures: "1000"
    Vis/MinInliers: "15"

    # RGB-D Virtual Camera Odometry
    Odom/Strategy: "0"  # Frame-to-Map or Frame-to-Frame
    Odom/ResetCountdown: "1"

rtabmap:
  ros__parameters:
    frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    publish_tf: true
    subscribe_rgbd: true
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_scan: false
    approx_sync: true
    queue_size: 20
    wait_for_transform: 0.5
    tf_tolerance: 0.3

    # Force 2D SLAM for planar ground UGV
    Reg/Force3DoF: "true"
    Optimizer/Slam2D: "true"

    # Memory / Database
    Mem/IncrementalMemory: "true"
    Mem/InitWMWithAllNodes: "false"
    Mem/RehearsalSimilarity: "0.60"
    Mem/DepthCompressionFormat: ".png"
    RGBD/LinearUpdate: "0.20"
    RGBD/AngularUpdate: "0.15"
    RGBD/ProximityBySpace: "false"
    RGBD/OptimizeFromGraphEnd: "false"
    RGBD/NeighborLinkRefining: "false"

    # Visual Feature Extraction for SLAM
    Vis/FeatureType: "8"
    Vis/MaxFeatures: "1000"
    Vis/MinInliers: "15"

    # 2D Grid Map generation for Nav2
    Grid/FromDepth: "true"
    Grid/RangeMax: "15.0"
    Grid/RayTracing: "true"
    Grid/CellSize: "0.10"
    Grid/NormalsSegmentation: "false"
    Grid/MaxGroundHeight: "0.12"
    Grid/MaxObstacleHeight: "2.0"
    Grid/GroundIsObstacle: "false"
    Grid/NoiseFilteringRadius: "0.15"
    Grid/NoiseFilteringMinNeighbors: "5"
    GridGlobal/FootprintRadius: "0.55"
    GridGlobal/Eroded: "true"

