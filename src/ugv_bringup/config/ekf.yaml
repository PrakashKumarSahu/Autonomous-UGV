ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    sensor_timeout: 0.1
    transform_time_offset: 0.25
    transform_timeout: 0.25

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true
    publish_acceleration: false

    # 1. Wheel Encoders Odometry (from diff_drive_controller)
    # Provides reliable linear and angular velocity in the robot frame
    odom0: /diff_drive_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # 2. 6-Axis IMU (from Gazebo or hardware sensor)
    # Provides high-rate angular velocity (yaw rate)
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false

    # 3. Visual Odometry (from RTAB-Map)
    # Provides absolute visual displacement in 2D
    odom1: /rtabmap/odom
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: true
    odom1_relative: false
